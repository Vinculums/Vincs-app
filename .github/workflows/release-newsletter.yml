# 릴리스 소식 메일 — 이 리포에서 릴리스를 **발행(publish)** 하는 순간 구독자에게 알린다.
#
# 왜 이 리포인가: 설치본은 비공개 소스 리포(Vinclums/Vinc)의 release 워크플로가 만들어
# 여기에 **draft** 로 올린다. 사람이 내용을 확인하고 발행 버튼을 누르는 순간이 곧
# "세상에 나온 시점"이고, `release: published` 는 거기서만 뜬다. 소스 리포의 태그
# 푸시에 걸면 아직 아무도 받을 수 없는 버전을 알리게 된다.
#
# 발송 자체는 계정 백엔드가 한다(수신자 목록·구독 상태·수신거부 헤더가 전부 거기 있다).
# 여기서는 신호만 넘긴다.
#
# 필요한 시크릿: NEWSLETTER_ADMIN_TOKEN — 계정 컨테이너에 설정한 값과 같아야 한다.
#   ⚠ 토큰이 **양쪽 중 한쪽에만** 있으면 라우트가 "존재하지 않는 경로"처럼 응답한다
#   (일부러 그렇게 만들었다 — 이 파일이 공개라 경로가 이미 알려져 있으므로 401 을
#   주면 "여기 뭔가 있다"만 새기 때문). 그래서 오설정의 증상은 404 처럼 보이는 실패다.
#   먼저 dry-run 으로 대상 수를 확인하는 습관이 그 함정을 메운다.
name: release-newsletter

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "버전 태그 (예: v0.6.7)"
        required: true
      url:
        description: "릴리스 노트 URL (비우면 이 리포의 해당 태그)"
        required: false
      dry_run:
        description: "보내지 않고 대상 수만 확인"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-newsletter-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    # 프리릴리스는 알리지 않는다. 받는 사람에게는 "새 버전이 나왔다"는 뜻인데
    # 프리릴리스는 아직 그 말이 참이 아니다.
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    steps:
      - name: Send
        env:
          TOKEN: ${{ secrets.NEWSLETTER_ADMIN_TOKEN }}
          VERSION: ${{ github.event.release.tag_name || inputs.version }}
          URL: ${{ github.event.release.html_url || inputs.url }}
          DRY: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${TOKEN}" ]; then
            echo "::error::NEWSLETTER_ADMIN_TOKEN 이 없습니다. 계정 컨테이너와 같은 값을 이 리포 시크릿에 넣으세요."
            exit 1
          fi
          if [ -z "${VERSION}" ]; then
            echo "::error::버전이 비어 있습니다."
            exit 1
          fi

          url="${URL}"
          if [ -z "${url}" ]; then
            url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${VERSION}"
          fi
          dry="false"
          if [ "${DRY}" = "true" ]; then dry="true"; fi

          # body 는 반드시 실어야 한다. 본문 없는 POST 는 프록시가 Content-Type 을
          # 지워 버려 first-party 가드가 400 으로 막는다(실측).
          payload=$(jq -nc --arg v "${VERSION}" --arg u "${url}" --argjson d "${dry}" \
            '{version:$v, url:$u, dryRun:$d}')

          echo "→ ${VERSION} (dryRun=${dry})"

          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
            --retry 3 --retry-connrefused --max-time 60 \
            -X POST "https://vincs.io/api/admin/newsletter/release" \
            -H "X-Newsletter-Token: ${TOKEN}" \
            -H "Content-Type: application/json" \
            -d "${payload}")

          echo "HTTP ${code}"
          cat /tmp/out.json || true
          echo

          case "${code}" in
            200|202) ;;
            400)
              echo "::error::요청이 거부됐습니다(400). 응답 본문을 보세요."
              exit 1 ;;
            *)
              # 404 처럼 보이면 대개 토큰 불일치다. 라우트가 부재로 위장하기 때문.
              echo "::error::발송 트리거 실패(HTTP ${code}). 토큰이 계정 컨테이너의 값과 같은지 먼저 확인하세요."
              exit 1 ;;
          esac

          {
            echo "### 릴리스 소식"
            echo
            echo "- 버전: \`${VERSION}\`"
            echo "- dryRun: \`${dry}\`"
            echo "- 응답: HTTP \`${code}\`"
            echo
            echo '```json'
            cat /tmp/out.json
            echo
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
